name: Salla stock watch

on:
  # البوت موقّف بطلب المستخدم: شلنا الجدول، والـ job ما يشتغل (if: false)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      # عداد الأخطاء المتتالية: نسترجع آخر قيمة ونحفظ الجديدة، عشان الحظر العابر ما يرسل إيميل
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: errors-${{ github.run_id }}
          restore-keys: errors-
      - id: check
        run: python check.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: errors-${{ github.run_id }}
