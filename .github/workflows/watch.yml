name: Salla stock watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      # عداد الأخطاء المتتالية: نسترجع آخر قيمة ونحفظ الجديدة، عشان الحظر العابر ما يرسل إيميل
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: errors-${{ github.run_id }}
          restore-keys: errors-
      - id: check
        run: python check.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: errors-${{ github.run_id }}
      - name: Disable workflow after notifying
        if: steps.check.outputs.available == 'true'
        run: gh workflow disable watch.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
